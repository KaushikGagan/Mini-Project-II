{% extends 'base.html' %}{% block content %}<section class="dashboard"><aside><a href="{{ url_for('citizen.dashboard') }}">Overview</a><a href="{{ url_for('citizen.applications') }}">Applications</a><a class="active">Certificates</a><form method="post" action="{{ url_for('auth.logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button>Sign Out</button></form></aside><div class="dashboard-content"><h1>Issued certificates</h1><section class="card table-card"><table>{% for certificate in certificates %}<tr><td>{{ certificate.document_id }}</td><td>{{ certificate.application.certificate_type }}</td><td><a class="button small" href="{{ url_for('citizen.download_certificate',document_id=certificate.document_id) }}">Download PDF</a></td></tr>{% else %}<tr><td>No certificates issued.</td></tr>{% endfor %}</table></section></div></section>{% endblock %}
