{% extends 'base.html' %}{% block title %}Citizen Registration | GovVerify{% endblock %}{% block content %}<section class="auth-wrap"><form class="card form-card" method="post"><p class="eyebrow">CITIZEN ONBOARDING</p><h1>Create your account</h1><div class="form-grid"><label>Full name<input name="full_name" required maxlength="120"></label><label>Aadhaar number<input name="aadhaar_number" inputmode="numeric" pattern="[2-9][0-9]{11}" required></label><label>Email address<input name="email" type="email" required></label><label>Phone number<input name="phone_number" inputmode="numeric" pattern="[6-9][0-9]{9}" required></label><label>Password<input name="password" type="password" required></label><label>Confirm password<input name="confirm_password" type="password" required></label></div><div class="otp-row"><label>One-time password<input name="otp" inputmode="numeric" pattern="[0-9]{6}" required></label><button id="request-otp" class="button ghost" type="button">Request OTP</button></div><button class="button full" type="submit">Verify and create account</button><p>Already registered? <a href="{{ url_for('auth.citizen_login') }}">Sign in</a></p></form></section>{% endblock %}
